<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Links attributed to ChatGPT</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <h1>Links attributed to ChatGPT</h1>
      <p id="summary" aria-live="polite">Scanning the page…</p>
    </header>

    <main>
      <div id="message" class="message" hidden></div>
      <ol id="link-list" class="link-list"></ol>
    </main>

    <footer id="footer" hidden>
      <button id="copy-all" class="copy-all" type="button">Copy all</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
